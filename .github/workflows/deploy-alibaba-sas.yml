# Deploy API + indexer + dashboard + console to Alibaba SAS.
# Landing stays on Vercel (polkaudit.xyz) — not deployed to SAS.
#
# One-time on SAS: docs/ALIBABA_SAS_DEPLOY.md → setup-sas.sh
#
# Required secrets: SAS_HOST, SAS_USER, SAS_SSH_KEY
#   SAS_USER is often "root" on Alibaba SAS (root-only SSH). App processes still run as "polkaudit".
# Optional: SAS_PORT, SAS_BRANCH, NEXT_PUBLIC_API_KEY, NEXT_PUBLIC_API_URL

name: Deploy Alibaba SAS

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/indexer/**'
      - 'apps/frontend/**'
      - 'apps/console/**'
      - 'deploy/alibaba/**'
      - '.github/workflows/deploy-alibaba-sas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-alibaba-sas
  cancel-in-progress: false

jobs:
  build-ui:
    name: Build dashboard + console (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/console/package-lock.json

      - name: Build frontend (dashboard)
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_CONSOLE_URL: https://console.polkaudit.xyz
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.polkaudit.xyz/api/v1}"
          npm ci
          npm run build
          bash ../../deploy/alibaba/pack-next-standalone.sh apps/frontend
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -czf "$GITHUB_WORKSPACE/artifacts/frontend.tar.gz" -C .next/standalone .

      - name: Build console (account UI)
        working-directory: apps/console
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://app.polkaudit.xyz
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.polkaudit.xyz/api/v1}"
          npm ci
          npm run build
          bash ../../deploy/alibaba/pack-next-standalone.sh apps/console
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -czf "$GITHUB_WORKSPACE/artifacts/console.tar.gz" -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: artifacts/*.tar.gz
          retention-days: 3

  deploy:
    name: SSH deploy (API + indexer + dashboard + console)
    needs: build-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_USER: ${{ secrets.SAS_USER }}
          SAS_SSH_KEY: ${{ secrets.SAS_SSH_KEY }}
        run: |
          # Trim accidental whitespace/newlines from pasted secrets
          SAS_HOST="$(echo -n "$SAS_HOST" | tr -d '[:space:]')"
          SAS_USER="$(echo -n "$SAS_USER" | tr -d '[:space:]')"
          for v in SAS_HOST SAS_USER SAS_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not set — see docs/ALIBABA_SAS_DEPLOY.md"
              exit 1
            fi
          done
          echo "SAS_HOST length=$(echo -n "$SAS_HOST" | wc -c) SAS_USER=$SAS_USER"

      - uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: artifacts

      - name: Configure SSH
        env:
          SAS_SSH_KEY: ${{ secrets.SAS_SSH_KEY }}
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_PORT: ${{ secrets.SAS_PORT }}
        run: |
          SAS_HOST="$(echo -n "$SAS_HOST" | tr -d '[:space:]')"
          PORT="$(echo -n "${SAS_PORT:-22}" | tr -d '[:space:]')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Normalize PEM: strip CR, ensure trailing newline
          printf '%s\n' "$SAS_SSH_KEY" | tr -d '\r' > ~/.ssh/sas_key
          chmod 600 ~/.ssh/sas_key
          ssh-keyscan -p "$PORT" -H "$SAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload artifacts + remote deploy
        env:
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_USER: ${{ secrets.SAS_USER }}
          SAS_PORT: ${{ secrets.SAS_PORT }}
          SAS_BRANCH: ${{ secrets.SAS_BRANCH }}
        run: |
          SAS_HOST="$(echo -n "$SAS_HOST" | tr -d '[:space:]')"
          SAS_USER="$(echo -n "$SAS_USER" | tr -d '[:space:]')"
          PORT="$(echo -n "${SAS_PORT:-22}" | tr -d '[:space:]')"
          BRANCH="${SAS_BRANCH:-main}"
          SSH=(ssh -i ~/.ssh/sas_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/sas_key -P "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)

          "${SSH[@]}" "${SAS_USER}@${SAS_HOST}" 'mkdir -p /tmp/polkaudit-artifacts'
          "${SCP[@]}" artifacts/frontend.tar.gz artifacts/console.tar.gz \
            "${SAS_USER}@${SAS_HOST}:/tmp/polkaudit-artifacts/"

          # SAS_USER is SSH login (often root). Apps run as polkaudit on the server.
          "${SSH[@]}" "${SAS_USER}@${SAS_HOST}" \
            "BRANCH='${BRANCH}' RUN_USER=polkaudit ARTIFACT_DIR=/tmp/polkaudit-artifacts bash /opt/polkaudit/deploy/alibaba/remote-deploy.sh"
