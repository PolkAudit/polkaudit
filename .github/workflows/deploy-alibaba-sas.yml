# Full-stack deploy to Alibaba Cloud Simple Application Server.
# Builds Next.js (landing + dashboard) in CI, then SSHs to install + restart all services.
#
# One-time on SAS: docs/ALIBABA_SAS_DEPLOY.md → setup-sas.sh
#
# Required secrets: SAS_HOST, SAS_USER, SAS_SSH_KEY
# Optional: SAS_PORT, SAS_BRANCH, NEXT_PUBLIC_API_KEY, NEXT_PUBLIC_* overrides

name: Deploy Alibaba SAS

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/indexer/**'
      - 'apps/frontend/**'
      - 'apps/landing/**'
      - 'deploy/alibaba/**'
      - '.github/workflows/deploy-alibaba-sas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-alibaba-sas
  cancel-in-progress: false

jobs:
  build-ui:
    name: Build Next.js (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/landing/package-lock.json

      - name: Build frontend (dashboard)
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.polkaudit.xyz/api/v1}"
          npm ci
          npm run build
          bash ../../deploy/alibaba/pack-next-standalone.sh apps/frontend
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -czf "$GITHUB_WORKSPACE/artifacts/frontend.tar.gz" -C .next/standalone .

      - name: Build landing
        working-directory: apps/landing
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ secrets.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_DEMO_URL: ${{ secrets.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_API_DOCS_URL: ${{ secrets.NEXT_PUBLIC_API_DOCS_URL }}
          NEXT_PUBLIC_GITHUB_URL: ${{ secrets.NEXT_PUBLIC_GITHUB_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://polkaudit.xyz}"
          export NEXT_PUBLIC_DASHBOARD_URL="${NEXT_PUBLIC_DASHBOARD_URL:-https://app.polkaudit.xyz}"
          export NEXT_PUBLIC_DEMO_URL="${NEXT_PUBLIC_DEMO_URL:-$NEXT_PUBLIC_DASHBOARD_URL}"
          export NEXT_PUBLIC_API_DOCS_URL="${NEXT_PUBLIC_API_DOCS_URL:-https://api.polkaudit.xyz/docs}"
          export NEXT_PUBLIC_GITHUB_URL="${NEXT_PUBLIC_GITHUB_URL:-https://github.com/PolkAudit/polkaudit}"
          export NEXT_PUBLIC_CONTACT_EMAIL="${NEXT_PUBLIC_CONTACT_EMAIL:-hello@polkaudit.xyz}"
          npm ci
          npm run build
          bash ../../deploy/alibaba/pack-next-standalone.sh apps/landing
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -czf "$GITHUB_WORKSPACE/artifacts/landing.tar.gz" -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: artifacts/*.tar.gz
          retention-days: 3

  deploy:
    name: SSH deploy (full stack)
    needs: build-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_USER: ${{ secrets.SAS_USER }}
          SAS_SSH_KEY: ${{ secrets.SAS_SSH_KEY }}
        run: |
          for v in SAS_HOST SAS_USER SAS_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not set — see docs/ALIBABA_SAS_DEPLOY.md"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: artifacts

      - name: Configure SSH
        env:
          SAS_SSH_KEY: ${{ secrets.SAS_SSH_KEY }}
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_PORT: ${{ secrets.SAS_PORT }}
        run: |
          PORT="${SAS_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SAS_SSH_KEY" > ~/.ssh/sas_key
          chmod 600 ~/.ssh/sas_key
          ssh-keyscan -p "$PORT" -H "$SAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload artifacts + remote deploy
        env:
          SAS_HOST: ${{ secrets.SAS_HOST }}
          SAS_USER: ${{ secrets.SAS_USER }}
          SAS_PORT: ${{ secrets.SAS_PORT }}
          SAS_BRANCH: ${{ secrets.SAS_BRANCH }}
        run: |
          PORT="${SAS_PORT:-22}"
          BRANCH="${SAS_BRANCH:-main}"
          SSH=(ssh -i ~/.ssh/sas_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/sas_key -P "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)

          "${SSH[@]}" "${SAS_USER}@${SAS_HOST}" 'mkdir -p /tmp/polkaudit-artifacts'

          "${SCP[@]}" artifacts/frontend.tar.gz artifacts/landing.tar.gz \
            "${SAS_USER}@${SAS_HOST}:/tmp/polkaudit-artifacts/"

          "${SSH[@]}" "${SAS_USER}@${SAS_HOST}" \
            "sudo BRANCH='${BRANCH}' RUN_USER='${SAS_USER}' ARTIFACT_DIR=/tmp/polkaudit-artifacts bash /opt/polkaudit/deploy/alibaba/remote-deploy.sh"
